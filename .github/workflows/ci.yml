name: GhostKitchen CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: pip install flake8 flake8-bugbear

      - name: Run flake8
        run: flake8 .

  # ── Unit tests ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (pytest — no Spark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install pytest faker kafka-python

      - name: Run unit tests (generators only — no Spark or Delta needed)
        run: |
          pytest tests/test_order_generator.py tests/test_sensor_generator.py \
            -v --tb=short

  # ── Integration tests (Spark + Delta + MinIO) ─────────────────────────────
  integration-tests:
    name: Integration Tests (Spark + Delta Lake)
    runs-on: ubuntu-latest
    # Only run on merge to main to save CI minutes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java 17 (required by PySpark 4.x)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Start MinIO
        # The minio image requires a startup command ("server /data") which
        # GitHub Actions service containers do not support.  Run it via
        # docker run so we can pass the command explicitly.
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address ":9001"
          for i in $(seq 1 15); do
            curl -sf http://localhost:9000/minio/health/live && echo "MinIO ready" && break
            echo "Waiting for MinIO... ($i/15)"; sleep 2
          done

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create MinIO bucket
        run: |
          pip install minio
          python - <<'EOF'
          from minio import Minio
          client = Minio("localhost:9000", access_key="minioadmin",
                         secret_key="minioadmin", secure=False)
          if not client.bucket_exists("ghostkitchen-lakehouse"):
              client.make_bucket("ghostkitchen-lakehouse")
          print("Bucket ready.")
          EOF

      - name: Run Gold dimension unit tests
        run: |
          pytest tests/test_gold_dimensions.py -v --tb=short
        env:
          PYTHONPATH: .

      - name: Run Gold fact unit tests
        run: |
          pytest tests/test_gold_facts.py -v --tb=short
        env:
          PYTHONPATH: .
